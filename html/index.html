  <script src="keygen.js"></script>
  <script>
  (function () {
    "use strict";
    var ALL = document.getElementById("ALL");
    function byId(id) { return document.getElementById(id); }

    // "所有功能" clears every module; any module clears "所有功能" (matches the C# events).
    ALL.addEventListener("change", function () {
      if (!this.checked) return;
      Keygen.MODULES.forEach(function (m) { byId(m.code).checked = false; });
    });
    Keygen.MODULES.forEach(function (m) {
      byId(m.code).addEventListener("change", function () {
        if (this.checked) ALL.checked = false;
      });
    });

    function readSelection() {
      var quantities = {};
      Keygen.MODULES.forEach(function (m) { quantities[m.code] = byId(m.code + "QTY").value; });
      var checked = [];
      Keygen.MODULES.forEach(function (m) { if (byId(m.code).checked) checked.push(m.code); });
      return {
        customerCode: byId("CCode").value,
        installCode: byId("SN").value,
        company: byId("REGSTR").value,
        allFeatures: ALL.checked,
        allQuantity: byId("ALLQTY").value,
        checked: checked,
        quantities: quantities
      };
    }

    byId("Button1").addEventListener("click", function () {
      try {
        var res = Keygen.generate(readSelection());
        byId("KEY").value = res.serial;
        byId("PW").value = res.password;
      } catch (e) {
        if (e && e.name === "KeygenError") { alert(e.message); }
        else { alert("生成失败：" + (e && e.message ? e.message : e)); throw e; }
      }
    });
  })();
  </script>
